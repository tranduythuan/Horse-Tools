name: Release

# Build a distributable plugin ZIP and publish a GitHub Release whenever a
# version tag (e.g. v1.2.0) is pushed:  git tag v1.2.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check the brand mark file is in sync
        run: |
          set -euo pipefail
          # img/horse-tools-mark.svg is generated from horsetools_brand_mark_svg().
          # A hand-edited copy would be a second drawing that quietly drifts from
          # the one every screen actually renders.
          php tools/export-brand-mark.php --check

      - name: Check every string has a Vietnamese translation
        run: |
          set -euo pipefail
          # The admin reads half Vietnamese and half English the moment a batch of
          # new strings ships untranslated — which is what happened when the
          # screens were regrouped and 85 new group and tab names arrived in
          # English. Catch it here rather than after release.
          # --count exits 1 when anything is missing, so read it without set -e
          # tearing the step down before the message below is printed.
          MISSING="$(php tools/check-translations.php --count || true)"
          if [ "$MISSING" != "0" ]; then
            echo "::error::$MISSING translatable strings have no Vietnamese translation."
            php tools/check-translations.php || true
            exit 1
          fi

      - name: Build plugin ZIP
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Warn (do not fail) if the tag doesn't match the plugin header version.
          HEADER_VERSION="$(grep -oiP '^\s*\*\s*Version:\s*\K[0-9][0-9A-Za-z.\-]*' horse-tools.php | head -n1 || true)"
          if [ -n "$HEADER_VERSION" ] && [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "::warning::Tag version ($VERSION) does not match horse-tools.php header ($HEADER_VERSION)."
          fi

          # Copy the plugin into a top-level 'horse-tools/' folder so it installs
          # cleanly in WordPress, excluding dev-only files.
          mkdir -p build/horse-tools
          rsync -a --exclude-from=.distignore ./ build/horse-tools/

          # Ship the Google API client (only used by the optional Google Login /
          # SEO Indexing features) as a single archive, so a normal install
          # unpacks ~280 files instead of ~760 — far faster on hosts without the
          # PHP zip extension. It is unpacked on first use by
          # horsetools_google_autoload_path().
          if [ -d build/horse-tools/link/google-api ]; then
            ( cd build/horse-tools/link/google-api && zip -rqX ../google-api.zip . )
            rm -rf build/horse-tools/link/google-api
            echo "Compressed google-api -> google-api.zip ($(du -h build/horse-tools/link/google-api.zip | cut -f1))"
          fi

          ( cd build && zip -rq "../horse-tools-${VERSION}.zip" horse-tools )
          echo "Built horse-tools-${VERSION}.zip:"
          ls -lh "horse-tools-${VERSION}.zip"

      - name: Extract changelog notes
        run: |
          set -euo pipefail
          # Pull the "= <version> =" block from the readme.txt changelog.
          NOTES="$(awk -v v="= ${VERSION} =" '
            $0==v {flag=1; next}
            /^= [0-9]/ && flag {exit}
            /^== / && flag {exit}
            flag {print}
          ' readme.txt | sed '/^[[:space:]]*$/{/./!d}')"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Release ${VERSION}. See readme.txt for details."
          fi
          {
            printf '%s\n' "$NOTES"
            printf '\n---\n_Install: download `horse-tools-%s.zip` below, then Plugins → Add New → Upload Plugin._\n' "$VERSION"
          } > release-notes.md

      - name: Build update manifest
        run: |
          set -euo pipefail
          # A few hundred bytes that the plugin reads instead of calling the
          # GitHub API: served from the release CDN, so the API's 60-per-hour
          # per-IP limit stops mattering however many sites run the plugin.
          # Its fixed name is what makes /releases/latest/download/update.json
          # always resolve to the newest release.
          NOTES="$(head -c 4000 release-notes.md)"
          jq -n \
            --arg v   "$VERSION" \
            --arg pkg "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/horse-tools-${VERSION}.zip" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg n   "$NOTES" \
            '{version:$v, package:$pkg, url:$url, requires:"6.0", requires_php:"8.1", notes:$n}' \
            > update.json
          echo "update.json ($(wc -c < update.json) bytes):"
          cat update.json | head -c 300; echo

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          # `gh release create` from a workstation creates the tag as well, which
          # pushes the tag, which starts this workflow — and it then failed on
          # "a release with the same tag name already exists". Five releases in a
          # row went out red that way. The releases were fine; what was lost is
          # everything above this step, because a hand-made release skips the
          # brand-mark check, the translation gate, and the ZIP build that packs
          # link/google-api down to one archive. So this replaces the assets of a
          # release that is already there rather than giving up: whichever way a
          # release was started, what ends up attached to it is what CI built.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists — replacing its assets with the ones built here."
            gh release upload "$GITHUB_REF_NAME" \
              "horse-tools-${VERSION}.zip" \
              update.json \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Horse Tools ${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "horse-tools-${VERSION}.zip" \
              update.json \
              --title "Horse Tools ${VERSION}" \
              --notes-file release-notes.md \
              $PRERELEASE
          fi
